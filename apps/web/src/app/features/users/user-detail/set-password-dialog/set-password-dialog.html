<h2 mat-dialog-title>Set password</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="flex flex-col gap-2">
    <p>Set a new password for {{ data.user.name || data.user.email }} directly. They will be notified by email.</p>

    <mat-form-field appearance="outline">
      <mat-label>New password</mat-label>
      <input matInput type="password" formControlName="newPassword" data-testid="new-password-input" />
      @if (form.controls.newPassword.errors?.['zod']; as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>

    @if (serverError(); as error) {
      <p role="alert" data-testid="server-error">{{ error }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()" [disabled]="setPassword.isPending()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="setPassword.isPending()" data-testid="submit-button">
      {{ setPassword.isPending() ? 'Saving…' : 'Set password' }}
    </button>
  </mat-dialog-actions>
</form>
