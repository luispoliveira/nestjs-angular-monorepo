# Nginx — auth origin, split-subdomain topology (design.md → D1).
#
# A sibling subdomain of the frontend, dedicated to better-auth, so the
# session cookie can be scoped to their shared parent domain (COOKIE_DOMAIN)
# and read by every sibling application — see frontend.conf.
#
# Substituir antes de instalar:
#   <dominio-auth>  → o domínio público do serviço de auth (ex: auth.exemplo.com)
#
# Instalação:
#   sudo cp docs/deploy/nginx/auth.conf /etc/nginx/sites-available/auth
#   sudo nano /etc/nginx/sites-available/auth   # substituir <dominio-auth>
#   sudo ln -s /etc/nginx/sites-available/auth /etc/nginx/sites-enabled/auth
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <dominio-auth>

server {
    listen 80;
    listen [::]:80;
    server_name <dominio-auth>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <dominio-auth>;

    ssl_certificate     /etc/letsencrypt/live/<dominio-auth>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<dominio-auth>/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/auth-access.log;
    error_log  /var/log/nginx/auth-error.log warn;
}
