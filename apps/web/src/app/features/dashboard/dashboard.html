<div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
  @for (stat of stats; track stat.label) {
    <mat-card>
      <mat-card-content class="flex items-center justify-between">
        <div>
          <p class="text-sm">{{ stat.label }}</p>
          @if (stat.query.isPending()) {
            <mat-spinner diameter="24" data-testid="stat-loading" />
          } @else if (stat.query.isError()) {
            <p class="text-sm" data-testid="stat-error" role="alert">
              {{ stat.query.error().message }}
            </p>
          } @else {
            <p class="text-2xl font-bold" data-testid="stat-value">{{ stat.query.data() }}</p>
          }
        </div>
        <mat-icon>{{ stat.icon }}</mat-icon>
      </mat-card-content>
    </mat-card>
  }
</div>
