# Nginx — frontend origin, split-subdomain topology (design.md → D1).
#
# Serves the static Angular build directly and proxies this origin's own
# backend API same-origin under /api/ (and the worker's queue dashboard under
# /admin/queues/). Authentication lives on its own
# sibling subdomain — see auth.conf — so the session cookie can be shared
# across both (SSO) via COOKIE_DOMAIN.
#
# Substituir antes de instalar:
#   <dominio-frontend>  → o domínio público do frontend (ex: admin.exemplo.com)
#   <root-path>         → caminho absoluto para apps/web/dist/web/browser
#                          (ex: /opt/tx-home/apps/web/dist/web/browser)
#
# Instalação:
#   sudo cp docs/deploy/nginx/frontend.conf /etc/nginx/sites-available/frontend
#   sudo nano /etc/nginx/sites-available/frontend   # substituir os placeholders
#   sudo ln -s /etc/nginx/sites-available/frontend /etc/nginx/sites-enabled/frontend
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <dominio-frontend>

server {
    listen 80;
    listen [::]:80;
    server_name <dominio-frontend>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <dominio-frontend>;

    ssl_certificate     /etc/letsencrypt/live/<dominio-frontend>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<dominio-frontend>/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root <root-path>;
    index index.html;

    # Same-origin API proxy (design.md → D1) — more specific than the SPA
    # fallback below, so it must come first for nginx's longest-prefix
    # location match; it must never be captured by that fallback.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Worker queue dashboard (read-only Bull Board, admin-only — the worker
    # authenticates the session cookie itself). `^~` is load-bearing: without
    # it the static-asset regex below outranks this prefix and 404s the
    # board's own /admin/queues/static/*.js against the SPA root. No URI on
    # proxy_pass, so the path reaches the worker unchanged, which serves it at
    # exactly /admin/queues. The worker's port (3300) must not be exposed.
    location = /admin/queues {
        return 301 /admin/queues/;
    }

    location ^~ /admin/queues/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O service worker e o seu manifest de assets têm de ser revalidados em
    # cada carregamento: uma cópia em cache prenderia os utilizadores a um
    # build antigo e um novo deploy nunca lhes chegaria. Tem de vir antes do
    # bloco de extensões abaixo (o nginx usa a primeira regex que casa).
    # Um `add_header` dentro de um location anula os do `server`, por isso os
    # de segurança são repetidos aqui.
    location ~ ^/(?:ngsw-worker\.js|ngsw\.json|safety-worker\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # O mime.types do nginx não conhece `.webmanifest` (seria servido como
    # application/octet-stream). `default_type` aplica-se às extensões sem
    # mapeamento; o location exato tem prioridade sobre as regex abaixo. (Não
    # usar um bloco `types {}`: substituiria o mapa inteiro.)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # A request for a known static-asset extension either serves that exact
    # file or 404s — it must NOT fall back to index.html, or a genuinely
    # missing asset (e.g. a stale hashed chunk after a deploy) would
    # silently return the app shell with a 200 instead of failing loudly.
    location ~* \.(?:js|css|map|ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|json|txt)$ {
        try_files $uri =404;
    }

    # SPA history fallback — anything else (a client-side route with no
    # matching static file) resolves to index.html so the Angular router
    # can render it, on both direct navigation and a hard reload.
    location / {
        try_files $uri /index.html;
    }

    access_log /var/log/nginx/frontend-access.log;
    error_log  /var/log/nginx/frontend-error.log warn;
}
