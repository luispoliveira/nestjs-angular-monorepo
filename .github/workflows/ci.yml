name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Node version declarations
        run: node --test scripts/node-version.test.cjs

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test
        # apps/api's app.module.spec.ts validates env at import time; locally
        # that comes from the untracked .env. Dummy values, never used to connect.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          REDIS_HOST: localhost
          MONGO_URI: mongodb://localhost:27017/ci
          CORS_ORIGIN: http://localhost:3000
          FIELD_ENCRYPTION_KEY: ci-placeholder
          FIELD_ENCRYPTION_HMAC_KEY: ci-placeholder
          VAPID_PUBLIC_KEY: ci-placeholder

